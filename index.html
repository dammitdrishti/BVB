<nav>
    <a href="index.html" class="nav-brand">
        <img src="images/logo final.jpeg" alt="Logo">
        <span>Bharatiya Vidya Bhavan, Bhopal</span>
    </a>
    
    <button class="menu-toggle" aria-label="Toggle Navigation" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="nav-links" id="navLinks">
        <a href="#" onclick="closeMenu()">Home</a>
        <a href="#about" onclick="closeMenu()">About</a>
        <a href="#courses" onclick="closeMenu()">Courses</a>
        <a href="#contact" class="nav-cta" onclick="closeMenu()">Enquire Now</a>
    </div>
</nav>

<section class="hero">
    <div class="hero-content">
        <h1>Bharatiya Vidya Bhavan</h1>
        <p class="subtitle">Bhopal Kendra</p>
        <p class="tagline">Bhavan's Institute of Communication & Management</p>
        <div class="hero-btns">
            <a href="#courses" class="hero-cta">Explore Our Courses</a>
            <a href="#contact" class="hero-cta">Enquire Now</a>
        </div>
    </div>
</section>

<style>
    /* CSS FIXES FOR IMAGE 1 (MOBILE UI) */
    
    @media (max-width: 768px) {
        nav {
            padding: 0 1.5rem;
            justify-content: space-between;
        }

        .nav-brand span {
            font-size: 0.85rem;
            max-width: 150px;
            line-height: 1.2;
        }

        /* Hamburger Menu Styles */
        .menu-toggle {
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: none;
            border: none;
            cursor: pointer;
            z-index: 1001;
        }

        .menu-toggle span {
            width: 25px;
            height: 3px;
            background: var(--navy-dark);
            border-radius: 2px;
            transition: 0.3s;
        }

        .nav-links {
            position: fixed;
            top: 0;
            right: -100%;
            width: 70%;
            height: 100vh;
            background: white;
            flex-direction: column;
            justify-content: center;
            gap: 2rem;
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -10px 0 30px rgba(0,0,0,0.1);
        }

        .nav-links.active {
            right: 0;
        }

        /* Hero Text Spacing Fix for Image 1 */
        .hero {
            padding: 4rem 1.5rem;
        }

        .hero h1 {
            font-size: 2.4rem;
            margin-bottom: 0.5rem;
        }

        .hero .subtitle {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .hero .tagline {
            font-size: 0.9rem;
            margin-bottom: 2.5rem;
            opacity: 0.8;
        }

        .hero-btns {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
        }

        .hero-cta {
            width: 100%;
            margin: 0;
            padding: 1.2rem;
            font-size: 1rem;
        }
    }

    /* Desktop default for menu toggle */
    @media (min-width: 769px) {
        .menu-toggle { display: none; }
    }
</style>

<script>
    // Logic for Mobile Menu
    function toggleMenu() {
        const nav = document.getElementById('navLinks');
        nav.classList.toggle('active');
        
        // Optional: Animate hamburger to X
        const spans = document.querySelectorAll('.menu-toggle span');
        nav.classList.contains('active') ? 
            (spans[0].style.transform = 'rotate(45deg) translate(5px, 6px)',
             spans[1].style.opacity = '0',
             spans[2].style.transform = 'rotate(-45deg) translate(5px, -6px)') :
            (spans[0].style.transform = 'none',
             spans[1].style.opacity = '1',
             spans[2].style.transform = 'none');
    }

    function closeMenu() {
        document.getElementById('navLinks').classList.remove('active');
        const spans = document.querySelectorAll('.menu-toggle span');
        spans.forEach(s => s.style.transform = 'none');
        spans[1].style.opacity = '1';
    }
</script>
